name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble project (android shell stays out of the repo)
        run: bash tool/ci_build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: study-chat-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error
